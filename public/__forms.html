<!doctype html>
<html lang="es">
  <body>
    <!--
      Este archivo existe solo para que Netlify detecte el formulario durante el
      build. No se muestra a las personas que visitan el sitio: el formulario
      real se renderiza en React y envía sus datos a esta misma ruta.
    -->
    <form name="inscripcion" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="inscripcion" />
      <input name="nombre" />
      <input name="correo" type="email" />
      <textarea name="mensaje"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
